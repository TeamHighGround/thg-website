<div *ngIf="links" class="flex flex-wrap gap-2 sm:gap-3">

  <!-- Instagram -->
  <button *ngIf="links.instagram"
          type="button"
          (click)="openLink('instagram')"
          (mousedown)="onLinkMouseDown($event, 'instagram')"
          (auxclick)="onLinkAuxClick($event, 'instagram')"
          [class]="'group/btn rounded-full bg-gray-800/50 border border-gray-600 flex items-center justify-center transition-all duration-200 hover:bg-gray-700/70 hover:border-gray-500 hover:scale-110 hover:-translate-y-1 hover:shadow-lg hover:shadow-pink-500/20 focus:outline-none focus:ring-2 focus:ring-pink-400 ' + getSizeClasses()"
          [attr.aria-label]="'Suivre sur Instagram'">
    <i class="pi pi-instagram transition-colors duration-200 group-hover/btn:text-pink-400"></i>
  </button>

  <!-- Twitter -->

          type="button"

          [attr.aria-label]="'Suivre sur Twitter'">
    <i class="pi pi-twitter transition-colors duration-200 group-hover/btn:text-blue-400"></i>
