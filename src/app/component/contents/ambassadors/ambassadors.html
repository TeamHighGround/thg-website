<section class="min-h-screen py-12 sm:py-16 md:py-20 lg:py-28">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Header Section -->
    <div class="text-center mb-12 sm:mb-16">
      <h2 class="font-bold text-white mb-4 sm:mb-6 leading-tight
        text-2xl sm:text-3xl md:text-4xl lg:text-5xl">
        {{ 'contents.ambassadors.title' | transloco }}
      </h2>
      <p class="text-gray-300 leading-relaxed mx-auto px-4
        text-sm sm:text-base md:text-lg
        max-w-lg sm:max-w-2xl md:max-w-3xl">
        {{ 'contents.ambassadors.description' | transloco }}
      </p>
    </div>

    <!-- Ambassadors List -->
    <div class="flex flex-col gap-6 sm:gap-8 md:gap-12 lg:gap-16">
      <app-partner-card
        *ngFor="let ambassador of ambassadors; trackBy: trackByAmbassadorId"
        [partner]="ambassador"
        class="w-full">
      </app-partner-card>
    </div>

  </div>
</section>
