<div class="group relative bg-black bg-opacity-30 border-2 border-gray-800 rounded-xl overflow-hidden 
  transition-all duration-300 hover:transform hover:-translate-y-2 hover:border-thgGreen-900 hover:shadow-2xl hover:shadow-green-500/10
  hover:bg-opacity-50 w-full max-h-[400px]">

  <div class="flex flex-col lg:flex-row">
    
    <!-- Section Images -->
    <div class="max-h-[400px] w-auto object-cover transition-transform duration-300 group-hover:scale-105 lg:rounded-l-xl">
      <div class="relative w-full max-h-[400px] flex items-center justify-center">
        <img 
          [src]="partner.images[currentImageIndex]" 
          [alt]="partner.name"
          class="w-full max-h-[400px] object-cover transition-transform duration-300 group-hover:scale-105 lg:rounded-l-xl">
        
        <!-- Image Navigation (si plusieurs images) -->
        <div *ngIf="partner.images.length > 1" 
             class="absolute inset-0 flex items-center justify-between p-4 transition-opacity duration-300 opacity-0 group-hover:opacity-100">
          <button 
            type="button"
            (click)="previousImage(); $event.stopPropagation()"
            class="bg-black/70 hover:bg-black/90 text-white rounded-full p-3 transition-all duration-200 z-20 flex items-center justify-center min-w-[44px] min-h-[44px]">
            <i class="pi pi-chevron-left text-lg"></i>
          </button>
          <button 
            type="button"
            (click)="nextImage(); $event.stopPropagation()"
            class="bg-black/70 hover:bg-black/90 text-white rounded-full p-3 transition-all duration-200 z-20 flex items-center justify-center min-w-[44px] min-h-[44px]">
            <i class="pi pi-chevron-right text-lg"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Section Contenu -->
    <div class="flex-1 p-8 lg:p-12 flex flex-col justify-center">
      
      <!-- Nom du partenaire -->
      <h3 class="text-3xl lg:text-4xl font-bold text-white mb-4 group-hover:text-green-400 transition-colors duration-300">
        {{ partner.name }}
      </h3>

      <!-- Types/Roles -->
      <div class="mb-6">
        <div class="flex flex-wrap gap-2">
          <p-chip *ngFor="let type of partner.types" class="partner-role" [label]="type"></p-chip>
        </div>
      </div>

      <!-- Description -->
      <p class="text-gray-300 text-base lg:text-lg leading-relaxed mb-8 max-w-3xl">
        {{ partner.description }}
      </p>

      <!-- Réseaux sociaux -->
      <div *ngIf="partner.socialMedia" class="flex items-center space-x-4">
        <span class="text-gray-400 text-sm uppercase tracking-wider font-medium">{{ 'contents.partners.socialMedia.follow' | transloco }} :</span>
        
        <button *ngIf="partner.socialMedia.instagram"
                type="button"
                (click)="openSocialMedia('instagram')"
                class="social-btn group/btn">
          <i class="pi pi-instagram text-xl group-hover/btn:text-pink-400 transition-colors duration-200"></i>
        </button>
        
        <button *ngIf="partner.socialMedia.twitter"
                type="button"
                (click)="openSocialMedia('twitter')"
                class="social-btn group/btn">
          <i class="pi pi-twitter text-xl group-hover/btn:text-blue-400 transition-colors duration-200"></i>
        </button>
        
        <button *ngIf="partner.socialMedia.soundcloud"
                type="button"
                (click)="openSocialMedia('soundcloud')"
                class="social-btn group/btn">
          <i class="pi pi-volume-up text-xl group-hover/btn:text-orange-400 transition-colors duration-200"></i>
        </button>
        
        <button *ngIf="partner.socialMedia.spotify"
                type="button"
                (click)="openSocialMedia('spotify')"
                class="social-btn group/btn">
          <i class="pi pi-play text-xl group-hover/btn:text-green-400 transition-colors duration-200"></i>
        </button>
        
        <button *ngIf="partner.socialMedia.twitch"
                type="button"
                (click)="openSocialMedia('twitch')"
                class="social-btn group/btn">
          <i class="pi pi-video text-xl group-hover/btn:text-purple-400 transition-colors duration-200"></i>
        </button>
      </div>
    </div>

  </div>
</div>
