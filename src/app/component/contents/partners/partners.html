<section class="min-h-screen pt-12 pb-12 sm:pb-16 md:pb-20 lg:pb-28">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Header Section -->
    <div class="text-center mb-12 sm:mb-16">
      <h2 class="font-bold text-white mb-4 sm:mb-6 leading-tight
        text-2xl sm:text-3xl md:text-4xl lg:text-5xl">
        {{ 'contents.partners.title' | transloco }}
      </h2>
      <p class="text-gray-300 leading-relaxed mx-auto px-4
        text-sm sm:text-base md:text-lg
        max-w-lg sm:max-w-2xl md:max-w-3xl">
        {{ 'contents.partners.description' | transloco }}
      </p>
    </div>

    <!-- Chargement / état dégradé quand l'API ne répond pas -->
    <p *ngIf="etat().status === 'loading'" class="text-center text-gray-400">
      {{ 'contents.common.loading' | transloco }}
    </p>
    <p *ngIf="etat().status === 'error'" class="text-center text-gray-300">
      {{ 'contents.common.error' | transloco }}
    </p>

    <!-- Partners List -->
    <!-- Grille centrée : une rangée incomplète reste au milieu -->
    <div class="flex flex-wrap justify-center gap-6">
      <app-partner-card
        *ngFor="let partner of partners(); trackBy: trackByPartnerId"
        [partner]="partner"
        class="w-full sm:w-[calc((100%-1.5rem)/2)] lg:w-[calc((100%-3rem)/3)]">
      </app-partner-card>
    </div>

  </div>
</section>
