<div class="group relative bg-white/[0.025] border border-white/[0.08] rounded-[10px] overflow-hidden
  w-full transition-all duration-300
  hover:-translate-y-0.5 hover:border-thgGreen/30
   sm:max-h-[650px] md:max-h-[380px] lg:max-h-[450px]">

  <div class="flex flex-col lg:flex-row h-full">
    
    <!-- Section Images -->
    <div class="relative flex-shrink-0 w-full lg:w-auto 
      md:h-[450px] lg:max-h-[450px] lg:max-w-md xl:max-w-lg
      overflow-hidden">
      
      <img *ngIf="imageCourante() as image"
        [src]="image.url"
        [alt]="image.alt || partner.name"
        [width]="image.width"
        [height]="image.height"
        class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105 lg:rounded-l-[10px]">
      
      <!-- Navigation Images -->
      <div *ngIf="partner.images.length > 1" 
           class="absolute inset-0 flex items-center justify-between p-2 sm:p-4 
             opacity-0 group-hover:opacity-100 transition-opacity duration-300">
        <button 
          type="button"
          (click)="previousImage(); $event.stopPropagation()"
          class="bg-black/70 hover:bg-black/90 text-white rounded-full 
            transition-all duration-200 z-20 flex items-center justify-center
            w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12
            hover:scale-110 "
          [attr.aria-label]="'Image précédente'">
          <i class="pi pi-chevron-left text-xs sm:text-sm md:text-base"></i>
        </button>
        
        <button 
          type="button"
          (click)="nextImage(); $event.stopPropagation()"
          class="bg-black/70 hover:bg-black/90 text-white rounded-full 
            transition-all duration-200 z-20 flex items-center justify-center
            w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12
            hover:scale-110 "
          [attr.aria-label]="'Image suivante'">
          <i class="pi pi-chevron-right text-xs sm:text-sm md:text-base"></i>
        </button>
      </div>
    </div>

    <!-- Section Contenu -->
    <div class="flex-1 flex flex-col justify-center 
      p-4 sm:p-6 md:p-8 lg:p-10 xl:p-12">
      
      <!-- Nom du partenaire -->
      <h3 class="font-bold text-white mb-3 sm:mb-4 leading-tight
        text-lg sm:text-xl md:text-2xl lg:text-3xl xl:text-4xl
        group-hover:text-thgGreen transition-colors duration-300">
        {{ partner.name }}
      </h3>

      <!-- Types/Roles (Chips PrimeNG avec styles Tailwind) -->
      <div class="mb-4 sm:mb-6">
        <div class="flex flex-wrap gap-1 sm:gap-2">
          <p-chip 
            *ngFor="let type of partner.types" 
            class="partner-role" 
            [label]="type">
          </p-chip>
        </div>
      </div>

      <!-- Description -->
      <p class="text-gray-300 leading-relaxed mb-6 sm:mb-8 
        text-sm sm:text-sm md:text-base lg:text-lg xl:text-xl
        max-w-none sm:max-w-2xl lg:max-w-3xl">
        {{ partner.description }}
      </p>

      <!-- Réseaux sociaux -->
      <div *ngIf="partner.socialMedia"
           class="flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-4">

        <span class="text-gray-400 uppercase tracking-wider font-medium
          text-xs sm:text-sm flex-shrink-0">
          {{ 'contents.ambassadors.socialMedia.follow' | transloco }} :
        </span>

        <app-social-links [links]="partner.socialMedia" size="medium"></app-social-links>
      </div>
    </div>
  </div>
</div>
