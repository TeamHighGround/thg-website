<div class="admin-panel flex min-h-screen bg-thgDark text-white">
  <!-- Voile de fermeture du menu sur mobile -->
  @if (menuOuvert()) {
    <div class="fixed inset-0 z-30 bg-black/60 lg:hidden" (click)="fermerMenu()"></div>
  }

  <!-- Barre latérale de navigation -->
  <aside class="barre-laterale" [class.barre-laterale--ouverte]="menuOuvert()">
    <div class="flex items-center gap-2 px-4 py-5">
      <span class="grid h-8 w-8 place-items-center rounded-lg bg-thgGreen-500 font-black text-thgDark">
        T
      </span>
      <div class="min-w-0">
        <p class="truncate text-sm font-bold leading-tight">Team High Ground</p>
        <p class="text-[0.7rem] leading-tight text-white/45">Administration du site</p>
      </div>
    </div>

    <nav class="flex-1 space-y-0.5 px-2.5" aria-label="Sections du panel">
      @for (entree of menu(); track entree.chemin) {
        <a
          [routerLink]="entree.chemin"
          routerLinkActive="lien-actif"
          [routerLinkActiveOptions]="{ exact: entree.chemin === '/admin' }"
          class="lien-menu"
          (click)="fermerMenu()">
          <i class="pi {{ entree.icone }}"></i>
          <span>{{ entree.libelle }}</span>
        </a>
      }
    </nav>

    <div class="border-t border-white/8 p-3">
      <a
        href="/"
        target="_blank"
        rel="noopener"
        class="lien-menu !text-white/55"
        title="Ouvre le site public dans un nouvel onglet">
        <i class="pi pi-external-link"></i>
        <span>Voir le site</span>
      </a>

      @if (utilisateur()) {
        <div class="mt-2 rounded-lg bg-white/4 px-3 py-2.5">
          <p class="truncate text-xs font-medium text-white/85">{{ utilisateur()!.email }}</p>
          <p class="text-[0.68rem] text-white/40">
            {{ utilisateur()!.role === 'ADMIN' ? 'Administrateur' : 'Éditeur' }}
          </p>
          <button
            type="button"
            class="mt-2 w-full rounded-md border border-white/12 px-2 py-1.5 text-xs font-medium text-white/70 transition-colors hover:bg-white/8 hover:text-white"
            (click)="seDeconnecter()">
            <i class="pi pi-sign-out mr-1 text-[0.7rem]"></i> Se déconnecter
          </button>
        </div>
      }
    </div>
  </aside>

  <!-- Contenu -->
  <div class="flex min-w-0 flex-1 flex-col">
    <!-- Barre supérieure, uniquement sur petit écran -->
    <header
      class="sticky top-0 z-20 flex items-center gap-3 border-b border-white/8 bg-thgDark/95 px-4 py-3 backdrop-blur lg:hidden">
      <button
        type="button"
        class="rounded-md p-2 text-white/80 hover:bg-white/8"
        aria-label="Ouvrir le menu"
        (click)="basculerMenu()">
        <i class="pi pi-bars"></i>
      </button>
      <span class="text-sm font-semibold">Administration</span>
    </header>

    <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-6 sm:px-6 sm:py-8">
      <router-outlet />
    </main>
  </div>
</div>

<!-- Retours visuels partagés par tous les écrans -->
<p-toast position="bottom-right" />
<p-confirmdialog [style]="{ width: '28rem' }" />
