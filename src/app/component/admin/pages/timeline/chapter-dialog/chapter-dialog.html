<p-dialog
  [visible]="ouvert()"
  (visibleChange)="ouvert.set($event)"
  [header]="estCreation() ? 'Nouveau chapitre' : 'Modifier le chapitre'"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: '34rem' }"
  [breakpoints]="{ '640px': '95vw' }">

  <div class="space-y-4">
    <p class="bandeau-explication">
      <i class="pi pi-info-circle mt-0.5"></i>
      <span>
        Un chapitre regroupe plusieurs dates de l'histoire de l'association, par exemple
        « Parcours compétitif ».
      </span>
    </p>

    <app-i18n-field
      [(fr)]="titreFr"
      [(en)]="titreEn"
      libelle="Titre du chapitre"
      [obligatoire]="true"
      placeholder="Ex. : Parcours compétitif"
      aide="Le grand titre affiché au-dessus du groupe de dates." />

    <app-i18n-field
      [(fr)]="sousTitreFr"
      [(en)]="sousTitreEn"
      libelle="Sous-titre (facultatif)"
      placeholder="Ex. : De la création aux championnats régionaux"
      aide="Une phrase de contexte sous le titre. Laissez vide si ce n'est pas utile." />

    <app-publish-toggle [(publie)]="publie" nomElement="ce chapitre" />
  </div>

  <ng-template #footer>
    <button type="button" class="btn btn-discret" (click)="ouvert.set(false)">Annuler</button>
    <button type="button" class="btn btn-principal" [disabled]="enregistrement()" (click)="valider()">
      @if (enregistrement()) {
        <i class="pi pi-spin pi-spinner"></i> Enregistrement…
      } @else {
        <i class="pi pi-check"></i> Enregistrer
      }
    </button>
  </ng-template>
</p-dialog>
