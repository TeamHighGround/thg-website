<app-page-header
  titre="Timeline"
  description="L'histoire de l'association, organisée en chapitres. Chaque chapitre contient des dates."
  lienPublic="/#timeline">
  <button actions type="button" class="btn btn-principal" (click)="ouvrirChapitre(null)">
    <i class="pi pi-plus"></i> Nouveau chapitre
  </button>
</app-page-header>

@if (chargement()) {
  <p class="flex items-center gap-2 py-8 text-sm text-white/50">
    <i class="pi pi-spin pi-spinner"></i> Chargement de la timeline…
  </p>
} @else {
  <app-sortable-list
    [(elements)]="chapitres"
    [reordonner]="reordonnerChapitres"
    nomElement="chapitre"
    messageVide="Aucun chapitre pour l'instant. Créez-en un pour commencer la timeline.">
    <ng-template #ligne let-chapitre>
      <div class="w-full">
        <!-- En-tête du chapitre -->
        <div class="flex items-center gap-2">
          <button
            type="button"
            class="flex min-w-0 flex-1 items-center gap-2 text-left"
            (click)="basculer(chapitre.id)">
            <i
              class="pi text-xs text-white/40 transition-transform"
              [class.pi-chevron-right]="!estDeplie(chapitre.id)"
              [class.pi-chevron-down]="estDeplie(chapitre.id)"></i>
            <span class="min-w-0">
              <span class="block truncate text-sm font-semibold text-white">
                {{ chapitre.titleFr }}
              </span>
              <span class="text-xs text-white/45">
                {{ jalonsDe(chapitre.id).length }}
                {{ jalonsDe(chapitre.id).length > 1 ? 'dates' : 'date' }}
                @if (!chapitre.titleEn) {
                  · <span class="text-amber-300">traduction anglaise manquante</span>
                }
              </span>
            </span>
          </button>

          @if (chapitre.published) {
            <span class="pastille pastille-publie">En ligne</span>
          } @else {
            <span class="pastille pastille-brouillon">Brouillon</span>
          }

          <button
            type="button"
            class="btn btn-secondaire !px-2 !py-1"
            aria-label="Modifier le chapitre"
            (click)="ouvrirChapitre(chapitre, $event)">
            <i class="pi pi-pencil text-xs"></i>
          </button>
          <button
            type="button"
            class="btn btn-danger !px-2 !py-1"
            aria-label="Supprimer le chapitre"
            (click)="supprimerChapitre(chapitre, $event)">
            <i class="pi pi-trash text-xs"></i>
          </button>
        </div>

        <!-- Dates du chapitre -->
        @if (estDeplie(chapitre.id)) {
          <div class="mt-3 border-l border-white/8 pl-3">
            <app-sortable-list
              [elements]="jalonsDe(chapitre.id)"
              (ordreChange)="majJalons(chapitre.id, $event)"
              [reordonner]="reordonnerJalons"
              [gabarit]="gabaritJalon"
              nomElement="date"
              messageVide="Aucune date dans ce chapitre." />

              <ng-template #gabaritJalon let-jalon>
                <button
                  type="button"
                  class="flex w-full items-center gap-3 text-left"
                  (click)="ouvrirJalon(chapitre.id, jalon, $event)">
                  @if (jalon.image) {
                    <img [src]="jalon.image.url" alt="" class="h-9 w-14 shrink-0 rounded object-cover" />
                  } @else {
                    <span class="grid h-9 w-14 shrink-0 place-items-center rounded bg-white/6 text-white/30">
                      <i class="pi pi-image text-xs"></i>
                    </span>
                  }
                  <span class="min-w-0 flex-1">
                    <span class="block truncate text-sm font-medium text-white">
                      {{ jalon.titleFr }}
                      @if (jalon.hasBadge) {
                        <i class="pi pi-star-fill ml-1 text-[0.65rem] text-thgGreen-500"
                           title="Mis en avant"></i>
                      }
                    </span>
                    <span class="block truncate text-xs text-white/45">{{ jalon.dateLabelFr }}</span>
                  </span>
                  @if (!jalon.published) {
                    <span class="pastille pastille-brouillon">Brouillon</span>
                  }
                  <span
                    class="btn btn-danger !px-2 !py-1"
                    role="button"
                    [attr.aria-label]="'Supprimer ' + jalon.titleFr"
                    (click)="supprimerJalon(jalon, $event)">
                    <i class="pi pi-trash text-xs"></i>
                  </span>
                </button>
              </ng-template>

            <button
              type="button"
              class="btn btn-secondaire mt-2.5"
              (click)="ouvrirJalon(chapitre.id, null, $event)">
              <i class="pi pi-plus"></i> Ajouter une date à ce chapitre
            </button>
          </div>
        }
      </div>
    </ng-template>
  </app-sortable-list>
}

<app-chapter-dialog
  [(ouvert)]="dialogueChapitre"
  [chapitre]="chapitreEnCours()"
  (enregistre)="surChapitreEnregistre($event)" />

<app-milestone-dialog
  [(ouvert)]="dialogueJalon"
  [jalon]="jalonEnCours()"
  [chapterId]="chapitreDuJalon()"
  (enregistre)="surJalonEnregistre($event)" />
