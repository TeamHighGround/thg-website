<header class="mb-5">
  @if (retour()) {
    <a
      [routerLink]="retour()"
      class="mb-2 inline-flex items-center gap-1.5 text-xs font-medium text-white/55 transition-colors hover:text-thgGreen-500">
      <i class="pi pi-arrow-left text-[0.7rem]"></i> {{ libelleRetour() }}
    </a>
  }

  <div class="flex flex-wrap items-start justify-between gap-3">
    <div class="min-w-0">
      <h1 class="text-xl font-bold text-white sm:text-2xl">{{ titre() }}</h1>
      @if (description()) {
        <p class="mt-1 max-w-2xl text-sm leading-relaxed text-white/55">{{ description() }}</p>
      }
    </div>

    <div class="flex shrink-0 items-center gap-2">
      @if (lienPublic()) {
        <a
          [href]="lienPublic()"
          target="_blank"
          rel="noopener"
          class="btn btn-secondaire"
          title="Ouvre la page publique dans un nouvel onglet">
          <i class="pi pi-external-link"></i> Voir sur le site
        </a>
      }
      <ng-content select="[actions]"></ng-content>
    </div>
  </div>
</header>
