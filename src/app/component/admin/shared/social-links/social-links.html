<div>
  <p class="aide-champ !mt-0 mb-2">
    Collez l'adresse complète de chaque page. Laissez vide si le réseau n'existe pas : le lien ne
    s'affichera pas sur le site.
  </p>

  <div class="grid gap-2.5 sm:grid-cols-2">
    @for (reseau of reseaux(); track reseau.cle) {
      <div>
        <label class="mb-1 flex items-center gap-1.5 text-xs font-medium text-white/75"
               [attr.for]="'reseau-' + reseau.cle">
          <i class="pi {{ reseau.icone }} text-[0.7rem]"></i> {{ reseau.libelle }}
        </label>
        <input
          [id]="'reseau-' + reseau.cle"
          type="url"
          class="champ-texte"
          [class.champ-invalide]="!!erreur(reseau.cle)"
          [placeholder]="reseau.exemple"
          [ngModel]="lire(reseau.cle)"
          (ngModelChange)="ecrire(reseau.cle, $event)" />
        @if (erreur(reseau.cle)) {
          <p class="erreur-champ">{{ erreur(reseau.cle) }}</p>
        }
      </div>
    }
  </div>
</div>
