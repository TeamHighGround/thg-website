<div class="w-full">
  <div class="mb-1.5 flex flex-wrap items-center justify-between gap-2">
    <label class="libelle-champ !mb-0" [attr.for]="identifiant()">
      {{ libelle() }}
      @if (obligatoire()) {
        <span class="text-thgGreen-500" title="Champ obligatoire">*</span>
      }
    </label>

    <!-- Onglets de langue, sur le MÊME champ -->
    <div class="inline-flex overflow-hidden rounded-md border border-white/12 text-xs">
      <button
        type="button"
        class="px-2.5 py-1 font-semibold transition-colors"
        [class.bg-thgGreen-500]="langue() === 'fr'"
        [class.text-thgDark]="langue() === 'fr'"
        [class.text-white]="langue() !== 'fr'"
        [class.opacity-60]="langue() !== 'fr'"
        (click)="langue.set('fr')">
        FR
      </button>
      <button
        type="button"
        class="relative flex items-center gap-1 border-l border-white/12 px-2.5 py-1 font-semibold transition-colors"
        [class.bg-thgGreen-500]="langue() === 'en'"
        [class.text-thgDark]="langue() === 'en'"
        [class.text-white]="langue() !== 'en'"
        [class.opacity-60]="langue() !== 'en'"
        [title]="traductionManquante() ? 'Traduction anglaise manquante' : 'Traduction anglaise renseignée'"
        (click)="langue.set('en')">
        EN
        @if (traductionManquante()) {
          <span
            class="inline-block h-1.5 w-1.5 rounded-full bg-amber-400"
            aria-label="Traduction anglaise manquante"></span>
        }
      </button>
    </div>
  </div>

  @if (multiligne()) {
    <textarea
      [id]="identifiant()"
      class="champ-zone"
      [class.champ-invalide]="!!erreur()"
      [rows]="lignes()"
      [placeholder]="placeholder()"
      [ngModel]="valeur()"
      (ngModelChange)="ecrire($event)"></textarea>
  } @else {
    <input
      [id]="identifiant()"
      type="text"
      class="champ-texte"
      [class.champ-invalide]="!!erreur()"
      [placeholder]="placeholder()"
      [ngModel]="valeur()"
      (ngModelChange)="ecrire($event)" />
  }

  <div class="mt-1 flex flex-wrap items-start justify-between gap-2">
    <div class="min-w-0 flex-1">
      @if (erreur()) {
        <p class="erreur-champ">{{ erreur() }}</p>
      } @else if (aide()) {
        <p class="aide-champ">{{ aide() }}</p>
      }

      @if (langue() === 'en' && traductionManquante()) {
        <p class="mt-1 flex items-center gap-1.5 text-xs text-amber-300">
          <i class="pi pi-exclamation-triangle"></i>
          Traduction anglaise manquante : le site en anglais affichera un texte vide.
        </p>
      }
    </div>

    @if (langue() === 'en' && !francaisVide()) {
      <button
        type="button"
        class="shrink-0 text-xs font-medium text-thgGreen-500 underline underline-offset-2 hover:text-thgGreen-400"
        (click)="copierLeFrancais()">
        Copier le français
      </button>
    }
  </div>
</div>
