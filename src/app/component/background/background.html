<div class="background-container bg-thgDark absolute top-0 left-0 w-screen h-screen -z-10">
    <svg class="hidden md:block w-full h-full" id="visual-desktop" viewBox="0 0 1920 1080" width="1920" height="1080"
        xmlns="http://www.w3.org/2000/svg" version="1.1">

        <defs>
            <filter id="gaussian-blur" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="120" />
            </filter>

        </defs>

        <g class="blur-group">
            <circle r="119" cx="500" cy="592" fill="#AED4AC"></circle>
            <circle r="59" cx="790" cy="592" fill="#AED4AC"></circle>
            <circle r="59" cx="190" cy="892" fill="#AED4AC"></circle>
            <circle r="109" cx="1200" cy="302" fill="#AED4AC"></circle>
            <circle r="112" cx="1700" cy="172" fill="#AED4AC"></circle>
            <circle r="96" cx="1900" cy="872" fill="#AED4AC"></circle>

            <circle r="80" cx="170" cy="272" fill="#FFFFFF"></circle>
            <circle r="50" cx="770" cy="272" fill="#FFFFFF"></circle>
            <circle r="80" cx="1070" cy="672" fill="#FFFFFF"></circle>
        </g>
    </svg>

    <svg class="block md:hidden w-full h-full" id="visual-mobile" viewBox="0 0 400 800" width="400" height="800"
        xmlns="http://www.w3.org/2000/svg" version="1.1" preserveAspectRatio="xMidYMid slice">
        <defs>
            <filter id="blur-mobile" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="70" />
            </filter>
        </defs>
        <g filter="url(#blur-mobile)">
            <!-- Cercles repositionnés pour mobile -->
            <circle r="60" cx="200" cy="150" fill="#AED4AC"></circle>
            <circle r="40" cx="100" cy="300" fill="#AED4AC"></circle>
            <circle r="70" cx="320" cy="450" fill="#AED4AC"></circle>
            <circle r="50" cx="150" cy="600" fill="#AED4AC"></circle>
            <circle r="65" cx="280" cy="720" fill="#AED4AC"></circle>

            <circle r="40" cx="50" cy="200" fill="#FFFFFF"></circle>
            <circle r="55" cx="350" cy="350" fill="#FFFFFF"></circle>
            <circle r="35" cx="200" cy="550" fill="#FFFFFF"></circle>
        </g>
    </svg>
</div>
