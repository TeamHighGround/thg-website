# Public website: build on every push; a push to `main` then builds the Docker
# image and deploys it. The Karma specs are not maintained: the build, which also
# compiles the templates, is the check.
#
# On the server, thg-deploy replaces the web container and restores the previous
# image if the new one does not become healthy. See TeamHighGround/thg-infra.
# Settings: secret DEPLOY_SSH_KEY (app key); variables DEPLOY_HOST, DEPLOY_PORT,
# DEPLOY_USER, DEPLOY_KNOWN_HOSTS.
name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22   # same major version as the production image
          cache: npm

      - run: npm ci
      - run: npx ng build

      # Without the server bundle the site would ship without server-side rendering.
      - name: Check the server bundle
        run: test -f dist/thg-website/server/server.mjs

  deploy:
    name: Deploy to production
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t thg-web:${{ github.sha }} .

      - name: Export the image
        run: docker save thg-web:${{ github.sha }} | gzip -1 > "$RUNNER_TEMP/image.tgz"

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Missing secret DEPLOY_SSH_KEY or variable DEPLOY_KNOWN_HOSTS (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        run: >
          ssh -i ~/.ssh/deploy -p "${{ vars.DEPLOY_PORT }}"
          -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
          "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" "web ${{ github.sha }}"
          < "$RUNNER_TEMP/image.tgz"

      - name: Check server-side rendering
        run: |
          # The raw HTML must contain the API data: it is what search engines and
          # link previews see.
          curl -fsS https://teamhighground.fr/teams/lol | grep -q Kitano
          echo "OK: the served HTML contains the data."
          for page in / /careers /en/careers /contact; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://teamhighground.fr$page")
            echo "$page -> $code"; [ "$code" = 200 ]
          done

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy
