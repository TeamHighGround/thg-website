# Config nginx À L INTÉRIEUR du conteneur LXD, écoute sur 7000.
# Le nginx de la VM transmet le Host d origine et termine le HTTPS.
#
# Depuis la migration : le site n est plus statique. Trois composants tournent,
#   thg-web (systemd) : rendu serveur Angular      -> 127.0.0.1:4000
#   thg-api (systemd) : API + médias               -> 127.0.0.1:4001
#   thg-db  (docker)  : PostgreSQL                 -> 127.0.0.1:5433
# Le site statique d avant reste sauvegardé dans ~/backups/ (voir REPLI plus bas).
#
# Le panel d administration vit sur admin.teamhighground.fr (dépôt thg-admin, bloc
# nginx dans thg-admin/deploy/). Ce domaine-ci ne sert plus aucune route du panel.

upstream thg_web { server 127.0.0.1:4000; keepalive 16; }
upstream thg_api { server 127.0.0.1:4001; keepalive 16; }

server {
    listen 7000 default_server;
    server_name teamhighground.fr www.teamhighground.fr _;

    # L API accepte des images jusqu à 10 Mo. Sans cette ligne, nginx coupe à 1 Mo
    # (413) et tout envoi un peu lourd échoue depuis le panel.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";

    # Médias téléversés depuis le panel, servis par l API.
    location ^~ /media/ {
        proxy_pass http://thg_api;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Routes du panel : uniquement sur admin.teamhighground.fr. Ici, le site charge
    # des scripts tiers (widgets X, Umami) : aucune session ne doit pouvoir y naître
    # ni y être utilisée.
    location ^~ /api/admin/ { return 404; }
    location ^~ /api/auth/  { return 404; }

    # API publique.
    location ^~ /api/ {
        proxy_pass http://thg_api;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # Ancienne adresse du panel : redirection permanente vers son sous-domaine, en
    # gardant la page demandée (/admin/boutique -> admin.teamhighground.fr/boutique).
    location = /admin { return 301 https://admin.teamhighground.fr/; }
    location ^~ /admin/ {
        rewrite ^/admin/(.*)$ https://admin.teamhighground.fr/$1 permanent;
    }

    # Fichiers hashés du bundle : immuables.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|webp|avif|ico)$ {
        proxy_pass http://thg_web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Tout le reste : rendu serveur Angular.
    location / {
        proxy_pass http://thg_web;
        proxy_read_timeout 30s;
    }
}

# Umami (analytics.teamhighground.fr) — inchangé.
server {
    listen 7000;
    server_name analytics.teamhighground.fr;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
