# Config nginx à installer À L'INTÉRIEUR du conteneur LXD.
# Écoute sur 7000 (repris par le proxy LXD, puis par le nginx de la VM).
# Le nginx de la VM transmet le Host d'origine, ce qui permet de router
# teamhighground.fr -> site statique, analytics.teamhighground.fr -> Umami.

# Site statique (bloc par défaut)
server {
    listen 7000 default_server;
    server_name teamhighground.fr www.teamhighground.fr _;

    root /var/www/thg-website;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets hashés (outputHashing: all) => cache long et immuable
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routes pré-rendues : /about -> /about/index.html
    # Fallback final vers /index.html pour les routes client (wildcard/404)
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }
}

# Umami (analytics.teamhighground.fr) -> conteneur Docker sur 127.0.0.1:3000
server {
    listen 7000;
    server_name analytics.teamhighground.fr;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Relaie le https d'origine terminé par le nginx de la VM
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
